server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/mailtm/ {
        proxy_pass https://api.mail.tm/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mail.tm;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # tempmail.id.vn：API key 和「删最旧邮箱」的逻辑都在 vnproxy 里，这里只做转发。
    #
    # 这里用字面 IP 127.0.0.1:8091，不用容器名：
    # 本容器跑在 host 网络下（network_mode: host），没有 Docker 内置 DNS
    # (127.0.0.11)，按容器名解析会直接报 "could not be resolved"。
    # 字面 IP 不需要解析，nginx 启动时也不会因为 vnproxy 没起来就退出 ——
    # 那种情况只会让这个路径返回 502，页面和 mail.tm 照常工作。
    location ^~ /api/vn/ {
        rewrite ^/api/vn/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8091;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        error_page 502 503 504 = @vnproxy_unavailable;
    }

    location @vnproxy_unavailable {
        default_type application/json;
        return 502 '{"success":false,"message":"mailbox service unavailable","kind":"other","data":null}';
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
