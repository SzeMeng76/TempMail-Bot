name: Build and Push Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 第一阶段：为 bot 和 web 两个镜像，分别在 amd64/arm64 上并行原生构建，按 digest 推送（不打最终 tag）
  build:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        image:
          - name: tempmail-bot
            context: .
            dockerfile: Dockerfile
          - name: tempmail-web
            context: ./frontend
            dockerfile: frontend/Dockerfile
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name and platform slug
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "platform_slug=$(echo '${{ matrix.platform.arch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.arch }}
          push: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ steps.image.outputs.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ steps.image.outputs.platform_slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ steps.image.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 第二阶段：为每个镜像合并两个平台的 digest，推送多架构 manifest
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        image: [tempmail-bot, tempmail-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          SOURCES=""
          for digest in *; do
            SOURCES="$SOURCES $IMAGE@sha256:$digest"
          done
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools create --tag "$tag" $SOURCES
          done <<< "$TAGS"
